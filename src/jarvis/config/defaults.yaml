# Internal Jarvis defaults

llm:
  # Keep ordinary chat on Groq. Gemini is reserved for the COMPLEX tier.
  default_provider: groq
  gemini:
    model_flash: gemini-3.7-flash
    model_pro: gemini-3.7-flash
    thinking_level_standard: low
    thinking_level_complex: high
    temperature: 0.7
    max_output_tokens: 2048
  groq:
    model: openai/gpt-oss-20b
    temperature: 0.3
    max_output_tokens: 1024

router:
  complexity_threshold: 0.8
  fast_keywords: ["hi", "hello", "thanks", "yes", "no", "ok"]

voice:
  enabled: true
  push_to_talk_key: ctrl+shift+j
  auto_detect: false
  tts_voice: en-GB-RyanNeural
  tts_rate: "+20%"
  tts_pitch: "-5Hz"
  stt_model: whisper-large-v3-turbo
  stt_language: en
  silence_duration: 0.55

memory:
  enabled: false
  data_dir: ./data
  exclude_patterns: ["password", "secret", "token", "*.env"]

logging:
  level: INFO
  format: console
  file: ./logs/jarvis.log
  max_size_mb: 10
  backup_count: 5

system:
  port: 8741
  weather_city: ""
