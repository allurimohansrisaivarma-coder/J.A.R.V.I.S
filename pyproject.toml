[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "Jarvis — Desktop Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "groq>=0.11.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "structlog>=24.0.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "edge-tts>=6.1.12",
    "onnxruntime>=1.17.0",
    "pygame>=2.5.2",
    "httpx>=0.27.0",
    "lancedb>=0.6.0",
    "sqlalchemy>=2.0.0",
    "ddgs>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "mss>=9.0.0",
    "Pillow>=10.0.0",
    "dxcam>=0.3.0",
    "pywin32>=306",
    "imagehash>=4.3.1",
    "pywebview>=5.0",
    "websockets>=12.0",
    "pynput>=1.7.6",
    "google-api-python-client>=2.0.0",
    "google-auth-oauthlib>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
jarvis = "jarvis.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=jarvis"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
