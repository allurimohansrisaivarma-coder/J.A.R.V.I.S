<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. HUD</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="hud-container">
        <!-- Top Tech Details -->
        <div class="hud-top-bar">
            <div class="hud-sys-status">SYS.ONLINE // MEM.OK // VAD.ACTV</div>
            <div class="hud-controls">
                <button id="settings-btn" class="hud-icon-btn" title="Settings">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
                <button id="minimize-btn" class="hud-icon-btn" title="Collapse to Widget">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="4 14 10 14 10 20"></polyline>
                        <polyline points="20 10 14 10 14 4"></polyline>
                        <line x1="14" y1="10" x2="21" y2="3"></line>
                        <line x1="3" y1="21" x2="10" y2="14"></line>
                    </svg>
                </button>
                <button id="close-btn" class="hud-icon-btn close-app-btn" title="Close JARVIS">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Central Holographic Core -->
        <div class="ai-core-container">
            <div id="ai-core" class="ai-core IDLE">
                <!-- Minimalist JARVIS SVG Core -->
                <svg class="core-svg" viewBox="0 0 100 100">
                    <!-- Outer rotating ring with gaps -->
                    <circle class="svg-ring outer" cx="50" cy="50" r="46" stroke-dasharray="60 10" />
                    <circle class="svg-ring outer-reverse" cx="50" cy="50" r="42" stroke-dasharray="30 5" />
                    <!-- Middle data ring -->
                    <circle class="svg-ring middle" cx="50" cy="50" r="32" stroke-dasharray="4 8" />
                    <!-- Inner solid ring -->
                    <circle class="svg-ring inner" cx="50" cy="50" r="22" stroke-dasharray="80 20" />
                    <!-- Core pulsing center -->
                    <circle class="svg-center" cx="50" cy="50" r="8" />
                    <!-- Decorative crosshairs -->
                    <line x1="50" y1="2" x2="50" y2="8" class="svg-crosshair" />
                    <line x1="50" y1="92" x2="50" y2="98" class="svg-crosshair" />
                    <line x1="2" y1="50" x2="8" y2="50" class="svg-crosshair" />
                    <line x1="92" y1="50" x2="98" y2="50" class="svg-crosshair" />
                </svg>
            </div>
            <div id="core-status-text" class="core-status-text">STANDBY</div>
        </div>
        
        <!-- Floating Chat Data Stream -->
        <main id="chat-container" class="hud-chat-stream">
            <div class="hud-message system">
                <span class="hud-msg-prefix">></span> SYSTEM INITIALIZED. WELCOME, SIR.
            </div>
        </main>
        
        <!-- Input Area HUD -->
        <footer class="hud-input-area">
            <div class="hud-input-box">
                <span class="hud-prompt">></span>
                <textarea id="message-input" placeholder="INPUT COMMAND..." rows="1"></textarea>
                <button id="mic-btn" class="hud-icon-btn mic" title="Hold to Speak (or hold Spacebar)">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                </button>
                <button id="send-btn" class="hud-icon-btn send" title="Transmit">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </footer>
        
        <!-- Settings Modal -->
        <div id="settings-modal" class="modal hidden">
            <div class="modal-content hud-modal">
                <div class="modal-header">
                    <h2>// CONFIGURATION</h2>
                    <button id="close-settings-btn" class="hud-icon-btn">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="setting-hotkey">GLOBAL OVERRIDE KEY</label>
                        <input type="text" id="setting-hotkey" value="ctrl+shift+j">
                    </div>
                    <div class="form-group">
                        <label for="setting-silence">VAD CUTOFF SENSOR (SEC)</label>
                        <input type="number" id="setting-silence" step="0.1" value="0.5">
                    </div>
                    <div class="form-group">
                        <label for="setting-voice">TTS VOCAL TRACT</label>
                        <input type="text" id="setting-voice" value="en-GB-RyanNeural">
                    </div>
                    <div class="form-group">
                        <label for="setting-rate">SPEECH VELOCITY</label>
                        <input type="text" id="setting-rate" value="+20%" pattern="[+-][0-9]+%">
                    </div>
                    <button id="save-settings-btn" class="hud-primary-btn">INITIALIZE OVERRIDE</button>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
