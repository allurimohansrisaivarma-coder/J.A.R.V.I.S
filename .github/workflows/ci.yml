name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Format check
        run: python -m ruff format --check src tests build.py
      - name: Lint
        run: python -m ruff check src tests build.py
      - name: Type check
        run: python -m mypy src
      - name: Tests
        run: python -m pytest --no-cov -q
